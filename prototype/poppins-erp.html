<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poppins · ERP Doméstico</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F0F2F5; color: #1F2937; font-size: 14px; line-height: 1.5; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }

    /* ── SHELL ── */
    .shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── TOPBAR ── */
    .topbar { height: 52px; min-height: 52px; background: #fff; border-bottom: 1px solid #E5E7EB; display: flex; align-items: center; padding: 0 16px; gap: 10px; z-index: 100; }
    .tb-hamburger { border: none; background: transparent; cursor: pointer; color: #6B7280; padding: 6px; border-radius: 6px; display: flex; }
    .tb-hamburger:hover { background: #F3F4F6; }
    .tb-period { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid #E5E7EB; border-radius: 20px; font-size: 13px; font-weight: 500; color: #374151; cursor: pointer; white-space: nowrap; }
    .tb-period:hover { background: #F9FAFB; }
    .tb-search { display: flex; align-items: center; gap: 8px; background: #F3F4F6; border-radius: 8px; padding: 0 12px; height: 34px; flex: 1; max-width: 380px; }
    .tb-search input { border: none; background: transparent; outline: none; font-family: inherit; font-size: 13px; color: #374151; width: 100%; }
    .tb-search input::placeholder { color: #9CA3AF; }
    .tb-spacer { flex: 1; }
    .tb-icon { border: none; background: transparent; cursor: pointer; color: #6B7280; padding: 7px; border-radius: 7px; display: flex; align-items: center; justify-content: center; transition: background 0.12s; }
    .tb-icon:hover { background: #F3F4F6; color: #374151; }
    .tb-user-chip { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 20px; cursor: pointer; border: 1px solid #E5E7EB; }
    .tb-user-chip:hover { background: #F9FAFB; }
    .tb-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #1B1564, #3730A3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .tb-user-name { font-size: 12px; font-weight: 500; color: #374151; }

    /* ── BODY AREA ── */
    .body-area { display: flex; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar { width: 220px; min-width: 220px; background: #1B1564; display: flex; flex-direction: column; overflow-y: auto; }
    .sb-brand { padding: 18px 16px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .sb-brand-icon { width: 36px; height: 36px; background: #F0197A; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .sb-brand-name { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 800; color: #fff; line-height: 1; }
    .sb-brand-sub { font-size: 9px; color: rgba(255,255,255,0.4); font-weight: 400; letter-spacing: 0.06em; margin-top: 1px; }
    .sb-section { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.28); padding: 14px 16px 4px; }
    .sb-item { display: flex; align-items: center; gap: 9px; padding: 8px 16px; font-size: 13px; color: rgba(255,255,255,0.6); cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; border-left: 3px solid transparent; transition: all 0.12s; }
    .sb-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.9); }
    .sb-item.active { background: rgba(240,25,122,0.15); color: #fff; border-left-color: #F0197A; font-weight: 600; }
    .sb-bottom { margin-top: auto; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.07); }
    .sb-user { display: flex; align-items: center; gap: 9px; }
    .sb-uavatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(240,25,122,0.7); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .sb-uname { font-size: 12px; font-weight: 600; color: #fff; }
    .sb-urole { font-size: 10px; color: rgba(255,255,255,0.38); }

    /* ── MAIN CONTENT ── */
    .main-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .page-area { flex: 1; overflow-y: auto; padding: 20px; background: #F0F2F5; }

    /* ── 3-PANEL PROFILE LAYOUT ── */
    .profile-shell { display: flex; gap: 16px; align-items: flex-start; }

    /* ── FICHA CARD (middle panel) ── */
    .ficha-card { width: 220px; min-width: 220px; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; }
    .ficha-top { padding: 20px 16px 14px; text-align: center; position: relative; border-bottom: 1px solid #F3F4F6; }
    .ficha-badge { position: absolute; top: 12px; right: 12px; background: #10B981; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
    .ficha-avatar-wrap { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #EEF2FF, #C7D2FE); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; border: 3px solid #E5E7EB; }
    .ficha-initials { font-size: 28px; font-weight: 700; color: #4338CA; }
    .ficha-name { font-size: 14px; font-weight: 700; color: #111827; margin-bottom: 2px; line-height: 1.3; }
    .ficha-role { font-size: 12px; color: #6B7280; }
    .ficha-actions { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid #F3F4F6; }
    .ficha-btn-icon { width: 30px; height: 30px; border: 1px solid #E5E7EB; border-radius: 6px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #9CA3AF; transition: all 0.12s; flex-shrink: 0; }
    .ficha-btn-icon:hover { background: #FEF2F2; border-color: #FECACA; color: #EF4444; }
    .ficha-btn-dropdown { flex: 1; height: 30px; border: 1px solid #E5E7EB; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; font-weight: 500; color: #374151; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; transition: background 0.12s; font-family: inherit; }
    .ficha-btn-dropdown:hover { background: #F9FAFB; }
    .ficha-btn-edit { width: 30px; height: 30px; border: none; border-radius: 6px; background: #1B1564; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
    .ficha-update-btn { display: flex; align-items: center; gap: 6px; width: calc(100% - 28px); margin: 10px 14px; height: 32px; border: 1px solid #E5E7EB; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; font-weight: 500; color: #374151; padding: 0 10px; transition: background 0.12s; font-family: inherit; }
    .ficha-update-btn:hover { background: #F9FAFB; }
    .ficha-section { border-top: 1px solid #F3F4F6; }
    .ficha-section-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 600; color: #374151; user-select: none; }
    .ficha-section-header:hover { background: #F9FAFB; }
    .ficha-section-body { padding: 0 14px 12px; }
    .ficha-info-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #F9FAFB; }
    .ficha-info-label { font-size: 11px; color: #9CA3AF; }
    .ficha-info-val { font-size: 11px; font-weight: 500; color: #374151; text-align: right; max-width: 120px; }

    /* ── CONTENT PANEL (right) ── */
    .content-panel { flex: 1; min-width: 0; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }

    /* ── TAB BAR (BUK exact style) ── */
    .tab-bar { display: flex; border-bottom: 1px solid #E5E7EB; overflow-x: auto; flex-shrink: 0; }
    .tab-bar::-webkit-scrollbar { height: 0; }
    .tab-btn { padding: 13px 16px; font-size: 13px; font-weight: 500; color: #6B7280; cursor: pointer; border: none; background: transparent; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: all 0.12s; font-family: inherit; display: flex; align-items: center; gap: 4px; }
    .tab-btn:hover { color: #F0197A; }
    .tab-btn.active { color: #F0197A; border-bottom-color: #F0197A; font-weight: 600; }
    .tab-content { flex: 1; overflow-y: auto; }
    .tab-inner { padding: 18px 20px; }

    /* ── TAB DROPDOWN ── */
    .tab-dd-wrap { position: relative; }
    .tab-dropdown { position: absolute; top: calc(100% + 4px); left: 0; background: #fff; border: 1px solid #E5E7EB; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); z-index: 50; min-width: 150px; padding: 4px 0; }
    .tab-dd-item { display: block; width: 100%; padding: 9px 16px; text-align: left; font-size: 13px; color: #374151; background: transparent; border: none; cursor: pointer; font-family: inherit; transition: background 0.1s; }
    .tab-dd-item:hover { background: #F9FAFB; color: #F0197A; }

    /* ── RESUMEN CONTENT ── */
    .resumen-grid { display: grid; grid-template-columns: 1fr 240px; gap: 20px; }
    .resumen-fields { }
    .resumen-row { display: flex; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #F3F4F6; gap: 16px; }
    .resumen-label { font-size: 13px; font-weight: 600; color: #374151; width: 160px; flex-shrink: 0; }
    .resumen-val { font-size: 13px; color: #374151; flex: 1; }
    .resumen-val.link { color: #F0197A; cursor: pointer; }
    .resumen-val.link:hover { text-decoration: underline; }
    .resumen-mini-chart { background: #F9FAFB; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .resumen-mini-title { font-size: 11px; font-weight: 600; color: #374151; margin-bottom: 8px; }
    .mini-bars { display: flex; align-items: flex-end; gap: 3px; height: 50px; }
    .mini-bar { flex: 1; border-radius: 2px 2px 0 0; }

    /* ── ACTION ROW ── */
    .action-row { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 20px; border-bottom: 1px solid #F3F4F6; flex-shrink: 0; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; transition: all 0.12s; font-family: inherit; white-space: nowrap; }
    .btn-primary { background: #1B1564; color: #fff; }
    .btn-primary:hover { background: #2D25A0; }
    .btn-pink { background: #F0197A; color: #fff; }
    .btn-pink:hover { background: #BE0F61; }
    .btn-outline { background: #fff; color: #374151; border: 1px solid #D1D5DB; }
    .btn-outline:hover { background: #F9FAFB; }
    .btn-outline-pink { background: #fff; color: #F0197A; border: 1px solid #F0197A; }
    .btn-outline-pink:hover { background: #FDF0F7; }
    .btn-ghost { background: transparent; color: #6B7280; border: 1px solid #E5E7EB; }
    .btn-ghost:hover { background: #F3F4F6; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-dd { position: relative; display: inline-flex; align-items: center; }
    .btn-dd-menu { position: absolute; top: calc(100% + 4px); right: 0; background: #fff; border: 1px solid #E5E7EB; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); z-index: 50; min-width: 180px; padding: 4px 0; }
    .btn-dd-item { display: block; width: 100%; padding: 9px 14px; font-size: 13px; color: #374151; text-align: left; background: transparent; border: none; cursor: pointer; font-family: inherit; }
    .btn-dd-item:hover { background: #F9FAFB; color: #F0197A; }

    /* ── LIQ TABLE ── */
    .liq-table-wrap { overflow-x: auto; }
    .liq-table-toolbar { display: flex; align-items: center; gap: 16px; padding: 10px 0 12px; flex-wrap: wrap; }
    .liq-table-toolbar-label { font-size: 13px; color: #6B7280; display: flex; align-items: center; gap: 6px; }
    .liq-table-toolbar-label select { border: 1px solid #D1D5DB; border-radius: 6px; padding: 3px 6px; font-family: inherit; font-size: 13px; }
    .liq-search { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .liq-search span { font-size: 13px; color: #6B7280; }
    .liq-search input { border: 1px solid #D1D5DB; border-radius: 6px; padding: 5px 10px; font-family: inherit; font-size: 13px; outline: none; }
    .liq-search input:focus { border-color: #F0197A; }
    table.liq { width: 100%; border-collapse: collapse; }
    table.liq th { background: #F9FAFB; font-size: 12px; font-weight: 600; color: #6B7280; text-align: left; padding: 9px 12px; border-bottom: 1px solid #E5E7EB; white-space: nowrap; border-right: 1px solid #F3F4F6; }
    table.liq th:first-child { width: 36px; }
    table.liq td { padding: 10px 12px; border-bottom: 1px solid #F3F4F6; font-size: 13px; color: #374151; white-space: nowrap; }
    table.liq tr:hover td { background: #FAFAFA; }
    .liq-link { color: #F0197A; cursor: pointer; font-weight: 600; }
    .liq-link:hover { text-decoration: underline; }
    .liq-pagination { display: flex; align-items: center; gap: 6px; padding: 12px 0 4px; font-size: 12px; color: #6B7280; }
    .page-btn { border: 1px solid #D1D5DB; background: #fff; border-radius: 5px; padding: 4px 8px; font-size: 12px; cursor: pointer; color: #374151; font-family: inherit; }
    .page-btn:hover { background: #F3F4F6; }
    .page-btn.active { background: #1B1564; color: #fff; border-color: #1B1564; }

    /* ── MODAL ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-box { background: #fff; border-radius: 10px; width: 700px; max-width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal-header { background: #1B1564; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .modal-title { font-size: 15px; font-weight: 700; color: #fff; }
    .modal-close { border: none; background: rgba(255,255,255,0.15); cursor: pointer; color: #fff; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .modal-close:hover { background: rgba(255,255,255,0.25); }
    .modal-body { overflow-y: auto; flex: 1; padding: 0; }
    .modal-emp-header { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; padding: 16px 20px; border-bottom: 1px solid #E5E7EB; background: #FAFAFA; }
    .modal-emp-col { display: flex; align-items: flex-start; gap: 10px; }
    .modal-emp-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #EEF2FF, #C7D2FE); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #4338CA; flex-shrink: 0; }
    .modal-emp-info { font-size: 12px; color: #374151; line-height: 1.7; }
    .modal-emp-info strong { display: block; font-size: 13px; font-weight: 700; color: #111827; }
    .modal-content { padding: 0 20px 16px; }
    .modal-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 16px; }
    .modal-col { }
    .modal-col:first-child { border-right: 1px solid #E5E7EB; padding-right: 20px; }
    .modal-col:last-child { padding-left: 20px; }
    .modal-section-title { font-size: 12px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #F3F4F6; display: flex; justify-content: space-between; }
    .modal-section-total { color: #111827; }
    .modal-line { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; color: #6B7280; border-bottom: 1px solid #F9FAFB; }
    .modal-line:last-child { border-bottom: none; }
    .modal-footer-row { display: grid; grid-template-columns: 1fr 1fr; margin-top: 12px; border-radius: 6px; overflow: hidden; }
    .modal-footer-cell { background: #EEF2FF; padding: 9px 12px; font-size: 12px; font-weight: 600; color: #1F2937; border-right: 1px solid #D1D5DB; }
    .modal-footer-cell:last-child { border-right: none; }
    .modal-three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; margin-top: 6px; border-radius: 6px; overflow: hidden; }
    .modal-three-cell { background: #F3F4F6; padding: 9px 12px; font-size: 12px; color: #6B7280; border-right: 1px solid #E5E7EB; }
    .modal-three-cell:last-child { border-right: none; }
    .modal-liquido { background: #1B1564; color: #fff; padding: 12px 20px; margin: 8px 0 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }

    /* ── SECTION ACCORDION (Historia, Asistencia, Vacaciones) ── */
    .section-block { border: 1px solid #E5E7EB; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
    .section-header { background: #EEF2FF; padding: 11px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .section-header-title { font-size: 13px; font-weight: 600; color: #1B1564; }
    .section-body { background: #fff; padding: 16px; }

    /* ── HISTORIA TIMELINE ── */
    .timeline-entry { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid #F3F4F6; }
    .timeline-dot { width: 28px; height: 28px; border-radius: 50%; background: #10B981; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .timeline-content { flex: 1; }
    .timeline-date { font-size: 12px; color: #9CA3AF; margin-bottom: 4px; }
    .timeline-title { font-size: 13px; font-weight: 600; color: #111827; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .timeline-duration { font-size: 11px; color: #9CA3AF; font-weight: 400; }
    .timeline-grid { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; }
    .tg-label { font-size: 12px; color: #9CA3AF; }
    .tg-val { font-size: 12px; color: #374151; }

    /* ── DOCUMENTOS ── */
    .docs-toggle { display: flex; gap: 0; margin-bottom: 14px; }
    .docs-toggle-btn { padding: 6px 16px; font-size: 13px; border: 1px solid #D1D5DB; background: #fff; cursor: pointer; color: #374151; font-family: inherit; transition: all 0.12s; }
    .docs-toggle-btn:first-child { border-radius: 6px 0 0 6px; }
    .docs-toggle-btn:last-child { border-radius: 0 6px 6px 0; border-left: none; }
    .docs-toggle-btn.active { background: #fff; border-color: #1B1564; color: #1B1564; font-weight: 600; }
    .docs-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .docs-folder-chip { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid #E5E7EB; border-radius: 6px; font-size: 13px; color: #374151; background: #F9FAFB; }
    .empty-state { text-align: center; padding: 40px 20px; color: #9CA3AF; }
    .empty-icon { font-size: 32px; margin-bottom: 10px; }
    .empty-text { font-size: 13px; }

    /* ── VACACIONES TABLE ── */
    table.vac { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.vac th { font-size: 12px; font-weight: 600; color: #6B7280; padding: 8px 12px; text-align: right; border-bottom: 1px solid #E5E7EB; }
    table.vac th:first-child { text-align: left; }
    table.vac td { padding: 8px 12px; border-bottom: 1px solid #F3F4F6; text-align: right; color: #374151; }
    table.vac td:first-child { text-align: left; color: #6B7280; }
    table.vac tr:last-child td { font-weight: 700; color: #111827; border-bottom: none; }
    table.simple { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.simple th { font-size: 12px; font-weight: 600; color: #6B7280; padding: 8px 12px; text-align: left; border-bottom: 1px solid #E5E7EB; background: #F9FAFB; }
    table.simple td { padding: 9px 12px; border-bottom: 1px solid #F3F4F6; color: #374151; }
    table.simple tr:last-child td { border-bottom: none; }

    /* ── BADGES ── */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }
    .badge-blue { background: #DBEAFE; color: #1E40AF; }
    .badge-pink { background: #FCE7F3; color: #9D174D; }
    .badge-gray { background: #F3F4F6; color: #4B5563; }

    /* ── DASHBOARD ── */
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    .page-title { font-size: 20px; font-weight: 700; color: #111827; }
    .page-sub { font-size: 13px; color: #6B7280; margin-top: 2px; }

          <Ic n="chev" s={14} c="#6B7280"/>
        </div>
        <div className="form-grid">
          <div className="form-group">
            <label className="form-label">Área <span className="required">*</span></label>
            <div style={{border:'1px solid #E5E7EB',borderRadius:7,padding:'8px 11px',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#F9FAFB'}}>
              <span style={{fontSize:13,color:'#374151'}}>{emp.empleador} ×</span>
              <Ic n="chev" s={12} c="#9CA3AF"/>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Cargo <span className="required">*</span></label>
            <div style={{border:'1px solid #E5E7EB',borderRadius:7,padding:'8px 11px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:13,color:'#374151'}}>{emp.cargo}</span>
              <Ic n="chev" s={12} c="#9CA3AF"/>
            </div>
            <div style={{fontSize:11,color:'#9CA3AF',marginTop:4}}>Si no encuentras el cargo, asegúrate de que haya sido creado y que esté asociado al área.</div>
          </div>
          <div className="form-group" style={{gridColumn:'1/-1'}}>
            <label className="form-label">Descripción del cargo</label>
            <textarea className="form-input" rows={3} style={{resize:'vertical'}} defaultValue={`Banda Salarial del Cargo: No definida\n\nDescripción específica: Empleada del hogar, realiza labores domésticas.`}/>
          </div>
        </div>
      </div>
      <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
        <button className="btn btn-outline" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={onClose}>Guardar cambios</button>
      </div>
    </div>
  </div>
);

/* ── EMPLOYEE PROFILE PAGE ── */
const ProfilePage = ({emp, setPage}) => {
  const [tab, setTab] = useState('resumen');
  const [itemsSubTab, setItemsSubTab] = useState('haberes');
  const [asistSubTab, setAsistSubTab] = useState('ausencias');
  const [editMode, setEditMode] = useState(false);

  const TABS = [
    {id:'resumen',label:'Resumen'},
    {id:'liquidaciones',label:'Liquidaciones'},
    {id:'documentos',label:'Documentos'},
    {id:'historia',label:'Historia'},
  ];

  return (
    <div>
      {/* BREADCRUMB */}
      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:14,fontSize:13}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setPage('colaboradoras')}>← Colaboradoras</button>
        <Ic n="chevR" s={13} c="#9CA3AF"/>
        <span style={{color:'#111827',fontWeight:600}}>{emp.nombre}</span>
      </div>

      <div className="profile-shell">
        <FichaCard emp={emp} onEdit={()=>setEditMode(v=>!v)}/>

        {editMode ? (
          <EditarTrabajo emp={emp} onClose={()=>setEditMode(false)}/>
        ) : (
          <div className="content-panel">
            {/* TAB BAR */}
            <div className="tab-bar">
              {TABS.map(t=>(
                <button key={t.id} className={`tab-btn${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
              ))}
              <TabDd label="Asistencia" active={tab==='asistencia'} activeTab={asistSubTab}
                items={[{id:'ausencias',label:'Ausencias'},{id:'horas_extra',label:'Horas Extra'}]}
                onSelect={id=>{setAsistSubTab(id);setTab('asistencia');}}/>
              <TabDd label="Ítems" active={tab==='items'} activeTab={itemsSubTab}
                items={[{id:'haberes',label:'Haberes'},{id:'descuentos',label:'Descuentos'},{id:'creditos',label:'Créditos'}]}
                onSelect={id=>{setItemsSubTab(id);setTab('items');}}/>
              <button className={`tab-btn${tab==='vacaciones'?' active':''}`} onClick={()=>setTab('vacaciones')}>Vacaciones</button>
            </div>

            {/* TAB CONTENT */}
            <div className="tab-content">
              {tab==='resumen'      && <TabResumen emp={emp} onEdit={()=>setEditMode(true)}/>}
              {tab==='liquidaciones'&& <TabLiquidaciones emp={emp}/>}
              {tab==='documentos'   && <TabDocumentos emp={emp}/>}
              {tab==='historia'     && <TabHistoria emp={emp}/>}
              {tab==='asistencia'   && <TabAsistencia emp={emp}/>}
              {tab==='items'        && <TabItems subTab={itemsSubTab}/>}
              {tab==='vacaciones'   && <TabVacaciones emp={emp}/>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

/* ── COLABORADORAS LIST ── */
const ColaboradorasList = ({setPage, setSelEmp}) => {
  const [perPage, setPerPage] = useState(25);
  const [filters, setFilters] = useState({});
  const [showModal, setShowModal] = useState(false);
  const [employees, setEmployees] = useState(EMPLOYEES);
  const [form, setForm] = useState({nombre:'',rut:'',cargo:'',ingreso:'',sueldo:'',contrato:'Indefinido',jornada:'44h semanales',afp:'Provida',salud:'Fonasa'});

  const cols = [
    {key:'nombre',label:'Nombre'},
    {key:'rut',label:'Número de Documento'},
    {key:'cargo',label:'Cargo'},
    {key:'ingreso',label:'Fecha Ingreso'},
    {key:'sueldo',label:'Sueldo Base'},
    {key:'estado',label:'Estado'},
  ];

  const filtered = employees.filter(e=>
    Object.entries(filters).every(([k,v])=>!v||String(e[k]??'').toLowerCase().includes(v.toLowerCase()))
  );

  const save = ()=>{
    setEmployees(prev=>[...prev,{...form,id:prev.length+1,sueldo:Number(form.sueldo)||0,liquidoTeorico:Math.round(Number(form.sueldo)*0.88)||0,area:'Hogar',banco:'BancoEstado',cuenta:'Cta. Rut',estado:'Activo',empleador:'Familia Aravena Riffo',email:'',tel:'',ficha:'F1'}]);
    setShowModal(false);
    setForm({nombre:'',rut:'',cargo:'',ingreso:'',sueldo:'',contrato:'Indefinido',jornada:'44h semanales',afp:'Provida',salud:'Fonasa'});
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Colaboradoras Vigentes</div>
          <div className="page-sub">{employees.length} colaboradoras registradas</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setShowModal(true)}><Ic n="plus" s={14}/>Crear</button>
      </div>

      <div className="buk-table-wrap">
        <div className="buk-toolbar">
          <div className="buk-per-page">Ver <select value={perPage} onChange={e=>setPerPage(+e.target.value)}>{[10,25,50].map(n=><option key={n} value={n}>{n}</option>)}</select></div>
          <span className="buk-count">de {employees.length}</span>
          <div className="buk-right">
            <button className="btn btn-ghost btn-sm"><Ic n="eye" s={13}/>Exportar</button>
          </div>
        </div>
        <table className="buk">
          <thead>
            <tr>
              <th style={{width:36}}><div className="th-inner"><div className="th-label"><input type="checkbox"/></div></div></th>
              {cols.map(c=>(
                <th key={c.key}>
                  <div className="th-inner">
                    <div className="th-label">{c.label} <span style={{color:'#D1D5DB',fontSize:10}}>⇅</span></div>
                    {c.key!=='estado' && (
                      <div className="th-filter">
                        <input placeholder="Buscar por..." value={filters[c.key]||''} onChange={e=>setFilters(f=>({...f,[c.key]:e.target.value}))}/>
                      </div>
                    )}
                  </div>
                </th>
              ))}
              <th style={{width:36}}><div className="th-inner"><div className="th-label"/></div></th>
            </tr>
          </thead>
          <tbody>
            {filtered.slice(0,perPage).map(emp=>(
              <tr key={emp.id}>
                <td><input type="checkbox" style={{cursor:'pointer'}}/></td>
                <td>
                  <div className="emp-cell">
                    <div className="emp-badge" style={{width:28,height:28,background:bc(emp.nombre)}}>{ini(emp.nombre)}</div>
                    <span className="emp-link" onClick={()=>{setSelEmp(emp);setPage('perfil');}}>{emp.nombre}</span>
                  </div>
                </td>
                <td>{emp.rut}</td>
                <td>{emp.cargo}</td>
                <td>{emp.ingreso}</td>
                <td>{fmt(emp.sueldo)}</td>
                <td>
                  <span className={`badge badge-${emp.estado==='Activo'?'green':emp.estado==='Licencia'?'yellow':'gray'}`}>{emp.estado}</span>
                </td>
                <td>
                  <button className="icon-btn" onClick={()=>{setSelEmp(emp);setPage('perfil');}}><Ic n="chevR" s={14}/></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {showModal && (
        <div className="modal-overlay" onClick={()=>setShowModal(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <span className="modal-title">Nueva Colaboradora</span>
              <button className="modal-close" onClick={()=>setShowModal(false)}><Ic n="x" s={14}/></button>
            </div>
            <div className="modal-body" style={{padding:24}}>
              <div className="form-grid">
                {[['nombre','Nombre completo (Apellidos, Nombre)','text'],['rut','RUT','text'],['cargo','Cargo','text'],['ingreso','Fecha de Ingreso','text'],['sueldo','Sueldo Base','number']].map(([k,l,t])=>(
                  <div key={k} className="form-group">
                    <label className="form-label">{l} <span className="required">*</span></label>
                    <input className="form-input" type={t} value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} placeholder={l}/>
                  </div>
                ))}
                {[['contrato','Tipo Contrato',['Indefinido','Plazo Fijo','Por obra o faena']],['jornada','Jornada',['44h semanales','33h semanales','Puertas adentro']],['afp','AFP',['Provida','Habitat','Capital','Cuprum','Planvital']],['salud','Salud',['Fonasa','Isapre Masvida','Isapre Cruz Blanca']]].map(([k,l,opts])=>(
                  <div key={k} className="form-group">
                    <label className="form-label">{l}</label>
                    <select className="form-input" value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))}>
                      {opts.map(o=><option key={o}>{o}</option>)}
                    </select>
                  </div>
                ))}
              </div>
            </div>
            <div style={{padding:'14px 24px',borderTop:'1px solid #E5E7EB',display:'flex',justifyContent:'flex-end',gap:10}}>
              <button className="btn btn-outline" onClick={()=>setShowModal(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={save}>Guardar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

/* ── DASHBOARD ── */
const Dashboard = ({setPage, setSelEmp}) => {
  const activas = EMPLOYEES.filter(e=>e.estado==='Activo').length;
  const totalLiq = LIQUIDACIONES.reduce((a,l)=>a+l.sueldo,0);
  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">¡Buen día, Rene! 👋</div>
          <div className="page-sub">Resumen de tu equipo doméstico — Febrero 2026</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-outline" onClick={()=>setPage('colaboradoras')}>Ver colaboradoras</button>
          <button className="btn btn-primary" onClick={()=>setPage('colaboradoras')}><Ic n="plus" s={14}/>Nueva colaboradora</button>
        </div>
      </div>
      <div className="stat-grid">
        {[
          {label:'Colaboradoras activas',val:activas,meta:`${EMPLOYEES.length} en total`,bg:'#1B1564',ic:'users'},
          {label:'Gasto mensual',val:fmt(totalLiq),meta:'Febrero 2026',bg:'#F0197A',ic:'cash'},
          {label:'Procesos abiertos',val:'0',meta:'Todo al día',bg:'#059669',ic:'doc'},
          {label:'Próximas vacaciones',val:'1',meta:'Carmen G. — marzo',bg:'#D97706',ic:'cal'},
        ].map(s=>(
          <div key={s.label} className="stat-card">
            <div className="stat-icon" style={{background:s.bg+'22'}}><Ic n={s.ic} s={20} c={s.bg}/></div>
            <div className="stat-label">{s.label}</div>
            <div className="stat-value" style={{fontSize: typeof s.val==='string'&&s.val.includes('$')?'16px':'22px'}}>{s.val}</div>
            <div className="stat-meta">{s.meta}</div>
          </div>
        ))}
      </div>
      <div className="two-col">
        <div className="card">
          <div className="card-title">Colaboradoras</div>
          {EMPLOYEES.map(emp=>(
            <div key={emp.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 0',borderBottom:'1px solid #F3F4F6',cursor:'pointer'}}
              onClick={()=>{setSelEmp(emp);setPage('perfil');}}>
              <div className="emp-badge" style={{width:32,height:32,background:bc(emp.nombre),fontSize:12}}>{ini(emp.nombre)}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,color:'#111827'}}>{emp.nombre}</div>
                <div style={{fontSize:11,color:'#9CA3AF'}}>{emp.cargo}</div>
              </div>
              <span className={`badge badge-${emp.estado==='Activo'?'green':emp.estado==='Licencia'?'yellow':'gray'}`}>{emp.estado}</span>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="card-title">Últimas Liquidaciones</div>
          {LIQUIDACIONES.map(l=>{
            const emp = EMPLOYEES.find(e=>e.id===l.empId);
            return (
              <div key={l.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 0',borderBottom:'1px solid #F3F4F6'}}>
                <div className="emp-badge" style={{width:30,height:30,background:bc(emp?.nombre||''),fontSize:11}}>{ini(emp?.nombre||'?')}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:600,color:'#111827'}}>{emp?.nombre?.split(',')[0]}</div>
                  <div style={{fontSize:11,color:'#9CA3AF'}}>{l.mes}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:12,fontWeight:700}}>{fmt(l.sueldo)}</div>
                  <span className={`badge badge-${l.estado==='Pagado'?'green':'yellow'}`} style={{fontSize:10}}>{l.estado}</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

/* ── SIMPLE PAGES ── */
const SimplePage = ({title, sub, children}) => (
  <div>
    <div className="page-header"><div><div className="page-title">{title}</div><div className="page-sub">{sub}</div></div></div>
    {children}
  </div>
);

/* ── APP ── */
const App = () => {
  const [page, setPage] = useState('dashboard');
  const [selEmp, setSelEmp] = useState(null);
  const period = 'Febrero 2026';

  const sideActive = {'perfil':'colaboradoras'}[page] || page;

  return (
    <div className="shell">
      <Topbar period={period}/>
      <div className="body-area">
        <Sidebar active={sideActive} setPage={setPage}/>
        <div className="main-content">
          <div className="page-area">
            {page==='dashboard' && <Dashboard setPage={setPage} setSelEmp={setSelEmp}/>}
            {page==='colaboradoras' && <ColaboradorasList setPage={setPage} setSelEmp={setSelEmp}/>}
            {page==='perfil' && selEmp && <ProfilePage emp={selEmp} setPage={setPage}/>}
            {page==='liquidaciones' && (
              <SimplePage title="Liquidaciones" sub="Gestión de sueldos">
                <div className="card">
                  <p style={{color:'#6B7280',fontSize:13}}>Selecciona una colaboradora para ver sus liquidaciones, o navega a su perfil.</p>
                </div>
              </SimplePage>
            )}
            {page==='asistencia' && (
              <SimplePage title="Asistencia" sub="Control de ausencias y permisos">
                <div className="card">
                  <div className="empty-state"><div className="empty-icon">📅</div><div className="empty-text">Sin registros de ausencia este mes</div></div>
                </div>
              </SimplePage>
            )}
            {page==='vacaciones' && (
              <SimplePage title="Vacaciones y Permisos" sub="Gestión de vacaciones legales">
                <div className="card">
                  <div className="empty-state"><div className="empty-icon">🌴</div><div className="empty-text">Sin solicitudes de vacaciones pendientes</div></div>
                </div>
              </SimplePage>
            )}
            {page==='procesos' && (
              <SimplePage title="Procesos" sub="Procesos mensuales de remuneraciones">
                <div className="card">
                  <div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">Sin procesos abiertos</div></div>
                </div>
              </SimplePage>
            )}
            {page==='beneficios' && (
              <SimplePage title="Beneficios" sub="Beneficios activos para tus colaboradoras">
                <div className="card">
                  <div className="empty-state"><div className="empty-icon">🎁</div><div className="empty-text">Sin beneficios configurados</div></div>
                </div>
              </SimplePage>
            )}
            {page==='configuracion' && (
              <SimplePage title="Configuración" sub="Ajustes del sistema">
                <div className="card">
                  <div className="empty-state"><div className="empty-icon">⚙️</div><div className="empty-text">Configuración del sistema</div></div>
                </div>
              </SimplePage>
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
