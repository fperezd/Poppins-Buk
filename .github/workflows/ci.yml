name: CI

# POP-C1-01: gate de calidad en cada PR y push a main.
# Corre lint + typecheck + tests (unit + fitness functions) + build.
# El build de Next ya hace typecheck, pero corremos `typecheck` aparte para
# un feedback más rápido y específico si fallan los tipos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs viejos del mismo PR/branch cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit + fitness)
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # El build no requiere credenciales reales (Supabase/BUK se usan en
          # runtime). Sentry queda no-op sin DSN. Definimos CI para silenciar
          # logs ruidosos y placeholders para cualquier acceso build-time.
          CI: "true"
