/* ─── COLABORADORAS ─── */
const Colaboradoras = ({emps, setEmps}) => {
  const [search, setSearch] = useState('');
  const [filtro, setFiltro] = useState('todos');
  const [selEmp, setSelEmp] = useState(null);
  const [editEmp, setEditEmp] = useState(null);
  const [showCreate, setShowCreate] = useState(false);

  const filtered = emps.filter(e=>{
    const ok = `${e.nombre} ${e.apellido} ${e.rut} ${e.cargo}`.toLowerCase().includes(search.toLowerCase());
    const st = filtro==='todos'||e.estado===filtro;
    return ok && st;
  });

  const handleSave = form => {
    if(editEmp) {
      setEmps(p=>p.map(e=>e.id===editEmp.id?{...e,...form}:e));
    } else {
      setEmps(p=>[...p,{...form,id:Date.now(),ini:`${form.nombre[0]||'?'}${(form.apellido||'?')[0]}`.toUpperCase(),col:randomColor()}]);
    }
    setEditEmp(null); setShowCreate(false);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      {selEmp && <EmpProfile emp={selEmp} onClose={()=>setSelEmp(null)} onEdit={()=>{setEditEmp(selEmp);setSelEmp(null);}}/>}
      {(showCreate||editEmp) && <EmpForm emp={editEmp} onClose={()=>{setShowCreate(false);setEditEmp(null);}} onSave={handleSave}/>}

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <h1 style={{fontSize:24,fontWeight:700,color:'#111827',margin:0}}>Colaboradoras Vigentes</h1>
          <p style={{fontSize:13,color:'#9CA3AF',margin:'4px 0 0'}}>{filtered.length} colaboradora{filtered.length!==1?'s':''}</p>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn-outline" style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}>
            <Ico n="doc" s={14}/>Abrir/Cerrar Liquidaciones
          </button>
          <button className="btn-pink" style={{display:'flex',alignItems:'center',gap:6}} onClick={()=>setShowCreate(true)}>
            <Ico n="plus" s={16}/>Crear Colaboradora
          </button>
        </div>
      </div>

      <div style={{display:'flex',gap:10}}>
        <div style={{flex:1,position:'relative'}}>
          <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#9CA3AF',display:'flex'}}><Ico n="search" s={15}/></span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por nombre, RUT o cargo…"
            style={{width:'100%',paddingLeft:36,paddingRight:12,paddingTop:10,paddingBottom:10,border:'1px solid #E5E7EB',borderRadius:10,fontSize:14,boxSizing:'border-box'}}/>
        </div>
        <select value={filtro} onChange={e=>setFiltro(e.target.value)}
          style={{border:'1px solid #E5E7EB',borderRadius:10,padding:'0 12px',fontSize:14}}>
          <option value="todos">Todos</option>
          <option value="activo">Activo</option>
          <option value="inactivo">Inactivo</option>
        </select>
      </div>

      <div style={{background:'#fff',borderRadius:16,boxShadow:'0 1px 4px rgba(0,0,0,0.07)',border:'1px solid #F1F5F9',overflow:'hidden'}}>
        <table>
          <thead>
            <tr style={{background:'#F8FAFC',fontSize:11,color:'#9CA3AF',textTransform:'uppercase',letterSpacing:'0.05em',borderBottom:'1px solid #F1F5F9'}}>
              {['Nombre','Número de Documento','Cargo','Fecha Ingreso','Sueldo Líquido','Estado','Acciones'].map((h,i)=>(
                <th key={h} style={{padding:'10px 16px',textAlign:i>=4&&i!==5?'right':i===5?'center':'left',fontWeight:600}}>{h}</th>
              ))}

            {filtered.map(emp=>{

                <tr key={emp.id} style={{borderBottom:'1px solid #F8FAFC'}} onMouseEnter={e=>e.currentTarget.style.background='#FAFAFA'} onMouseLeave={e=>e.currentTarget.style.background=''}>
                  <td style={{padding:'12px 16px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <Avatar ini={emp.ini} col={emp.col} size={36}/>
                      <div>
                        <div style={{fontWeight:600,color:'#111827',fontSize:14}}>{emp.nombre} {emp.apellido}</div>
                        <div style={{fontSize:12,color:'#9CA3AF'}}>{emp.email}</div>
                      </div>
                    </div>
                  </td>
                  <td style={{padding:'12px 16px',color:'#6B7280',fontFamily:'monospace',fontSize:13}}>{emp.rut}</td>
                  <td style={{padding:'12px 16px',color:'#4B5563',fontSize:13}}>{emp.cargo}</td>
                  <td style={{padding:'12px 16px',color:'#6B7280',fontSize:13}}>{fmtDate(emp.fecha_ingreso)}</td>
                  <td style={{padding:'12px 16px',textAlign:'right',fontWeight:700,color:'#1B1564',fontSize:14}}>{lastLiq?fmt(lastLiq.liquido):'—'}</td>

                      <button className="btn-icon" style={{color:'#EF4444'}} title="Eliminar"><Ico n="trash" s={15}/></button>

                  </td>

        </table>
        {filtered.length===0 && (
          <div style={{padding:48,textAlign:'center',color:'#9CA3AF'}}>
            <Ico n="users" s={36} style={{margin:'0 auto 8px',opacity:0.3}}/>
            <p style={{margin:0}}>No se encontraron colaboradoras</p>
          </div>
        )}
      </div>
    </div>
  );
};

  const toggle = k => setOpenSec(p=>({...p,[k]:!p[k]}));

  const sections = [
    { k:'adm', l:'Administrativo', items:[
      {k:'dashboard',       ic:'home',     l:'Panel de Control'},
      {k:'colaboradoras',   ic:'users',    l:'Colaboradoras Vigentes'},
      {k:'asistencia',      ic:'calendar', l:'Asistencia'},
      {k:'documentos',      ic:'doc',      l:'Documentos y Firma'},
      {k:'organizacion',    ic:'org',      l:'Organización'},
    ]},
    { k:'rem', l:'Remuneraciones', items:[
      {k:'liquidaciones',   ic:'currency', l:'Procesos'},
      {k:'tablas',          ic:'chart',    l:'Tablas de Parámetros'},
      {k:'archivos',        ic:'doc',      l:'Archivos y Pagos'},
      {k:'config_rem',      ic:'cog',      l:'Configuraciones'},

    { k:'ben', l:'Beneficios', items:[
      {k:'beneficios',      ic:'gift',     l:'Beneficios'},
      {k:'seguros',         ic:'id',       l:'Seguros'},
      {k:'config_ben',      ic:'cog',      l:'Configuraciones'},
    ]},
  ];

  return (
    <div style={{width:collapsed?64:220,flexShrink:0,background:'#100D3F',minHeight:'100vh',display:'flex',flexDirection:'column',transition:'width 0.2s'}}>
      {/* Logo */}

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2"><path d="M12 2a7 7 0 00-7 7v5H3l2 4h14l2-4h-2V9a7 7 0 00-7-7zM9 18v1a3 3 0 006 0v-1"/></svg>
        </div>
        {!collapsed && (
          <div style={{flex:1}}>
            <div style={{fontWeight:800,color:'#fff',fontSize:15,lineHeight:1}}>Poppins</div>

        )}
        <button className="btn-icon" style={{color:'rgba(255,255,255,0.3)',marginLeft:collapsed?0:'auto'}} onClick={()=>setCollapsed(!collapsed)}>
          <Ico n={collapsed?'chevR':'chevD'} s={13}/>
        </button>
      </div>

      {/* Nav */}
      <nav style={{flex:1,padding:'8px 8px',overflowY:'auto'}}>
        {sections.map(sec=>(
          <div key={sec.k}>

              <button key={item.k} className={`nav-item ${active===item.k?'active':''}`} onClick={()=>setActive(item.k)} title={collapsed?item.l:''} style={{justifyContent:collapsed?'center':'flex-start'}}>
                <Ico n={item.ic} s={16}/>
                {!collapsed && <span style={{fontSize:13}}>{item.l}</span>}
              </button>
            ))}

      {/* Footer */}
      {!collapsed && (
        <div style={{padding:'12px 14px',borderTop:'1px solid rgba(255,255,255,0.08)'}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{width:30,height:30,background:'#F0197A',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:12,flexShrink:0}}>MA</div>

      )}

};
